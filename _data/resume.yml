title: "简历标题"
lang: "zh" #语言设置 zh表示中文 en 表示英语
name: "叶锦"
jobtitle: "全栈开发、AI影视工程师" #可空不显示
photo: ""C:\Users\25365\Pictures\42FF4865F445444A9D346F42496084CD.jpg"" #照片可空，不显示

#联系方式
contact: #联系方式连接等3~5行
- text: "2536557902@qq.com" #文本内容
  href: 'mailto:youremail@example.com' #链接，无链接则空  
  icon: 'icons/email.svg' #图标 svg文件
- text: "15058392456"
  href: 'tel:1234567890'
  icon: 'icons/phone.svg'


#main下面是主体内容，类别条数不限
main: #简历主要内容，
- type: education #类别为ID
  name: 教育 #显示名称，空则使用type
  content: #内容基本格式 标题-副标题-日期-详细内容 (都允许空)
  - title: 温州大学
    duration: "2023年09月 - 2027年06月"
    sub: 地点或学历
    detail: 计算机与人工智能学院计算机科学与技术专业


- type: skills
  # name: "技能"
  content:
  - title: 编程技能
    items: #itmems 可以小块的方式显示
    - 前端开发
    - 小程序开发


- type: experience
  name: 经验
  content:
  - title: 职位
    sub: 瑭天影视
    duration: "2026年01月 - 2026年02月"
    tags:
    - 标签
    summary: 职务或者工作总结
    detail: 曾在瑭天影视公司进行AI漫剧的制作，在其中学习并开拓了专业课外的AI影视工程师的专业道路
  
- type: projects
  name: Projects
  content:
  - title: 项目名称
    duration: xxxx年xx月 - yyyy年yy月
    detail: 项目和工作介绍，项目总结.
    sub: 维护者
 

#others 其他简略内容(列表)
others: #其他列表显示
- type: others #ID可以为空
  name: '其他'
  content: #选择需要的格式
  - 单行文字
  - title: "加粗:"
    text: "列表项二"
  - title: "兴趣:"
    items: #单行列表
    - 睡觉
    - 吃饭
    - coding
  - title: 列表
    list:
    - 第一项
    - 第二项
